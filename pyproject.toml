# pyproject.toml
[project]
name = "rasa-rime-voice-demo"
version = "2.0.0"
description = "Low-latency voice orchestration with Rasa Pro, Rime TTS, and Deepgram ASR"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Rasa
    "rasa-pro>=3.9.0",
    "rasa-sdk>=3.8.0",

    # LLM
    "openai>=1.0.0",

    # Networking & async
    "aiohttp>=3.9.0",

    # Audio
    "pydub>=0.25.1",
    "simpleaudio>=1.0.4",

    # UI & utilities
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

dev = [
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only 'actions' and 'services' are real Python packages here.
# This prevents setuptools trying to compile 'data/' or 'conversations/'.
packages = ["actions", "services"]

[tool.uv]
# uv manages the virtualenv

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that require live services (Deepgram, Rime, Rasa)",
]
addopts = ["-v", "--tb=short"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "models", "__pycache__", ".rasa", "tests/audio"]