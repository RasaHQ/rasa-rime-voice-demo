# endpoints.yml

# ==============================================================================
# Action Server
# ==============================================================================
action_endpoint:
  url: "http://localhost:5055/webhook"

# ==============================================================================
# LLM Model Groups
# ==============================================================================
# Two separate model groups:
#   nebius_llm_gemma  — Rasa's CompactLLMCommandGenerator (no tool calls needed)
#                       Gemma: fast, no <think> tags, parses commands cleanly
#   nebius_llm_minimax — LLM Manager sub agent (needs tool_choice support)
#                        MiniMax: supports auto tool choice for MCPOpenAgent
 
model_groups:
  - id: nebius_llm
    models:
      - provider: self-hosted
        model: google/gemma-3-27b-it-fast
        api_base: "https://api.tokenfactory.nebius.com/v1"
        api_key: ${NEBIUS_API_KEY}
        temperature: 0.1
        max_tokens: 1024
        timeout: 30
 
  - id: nebius_llm_minimax
    models:
      - provider: self-hosted
        model: MiniMaxAI/MiniMax-M2.5
        api_base: "https://api.tokenfactory.us-central1.nebius.com/v1"
        api_key: ${NEBIUS_API_KEY}
        temperature: 0.7
        max_tokens: 512
        timeout: 60
 
  - id: nebius_embeddings
    models:
      - provider: openai
        model: Qwen/Qwen3-Embedding-8B
        api_base: "https://api.tokenfactory.nebius.com/v1"
        api_key: ${NEBIUS_API_KEY}

# ==============================================================================
# MCP Servers
# ==============================================================================
# Required by Rasa for RASA protocol sub agents.
# The llm_manager sub agent references this entry but excludes all its tools —
# it uses only its own custom tool definitions (check_account_balance, end_call).
# This server is never actually called during the demo.
mcp_servers:
  - name: fetch
    url: "http://localhost:8999/mcp"
    type: http

# ==============================================================================
# Tracing (Optional - for debugging and monitoring)
# ==============================================================================
# Distributed tracing helps you understand how requests flow through your assistant
# Uncomment one of the following configurations to enable tracing

# Option 1: Jaeger Backend (recommended for local development)
#tracing:
#  type: jaeger
#  host: localhost
#  port: 4317
#  service_name: voice-assistant
#  sync_export: false

# Option 2: OpenTelemetry Collector (OTLP) - for production
# tracing:
#   type: otlp
#   endpoint: my-otlp-host:4317
#   insecure: false  # Set to true for local development without TLS
#   service_name: voice-assistant
#   # Optional: Path to TLS certificate
#   # root_certificates: ./path/to/ca.pem

# ==============================================================================
# Silence Handling for Voice
# ==============================================================================
# Controls how long to wait for user input before timing out
interaction_handling:
  global_silence_timeout: 7  # seconds to wait before timeout
  # Optional: Configure per-channel silence timeouts
  # channels:
  #   rest:
  #     silence_timeout: 10

