# ==============================================================================
# NOTE: browser_audio channel intentionally omitted
# ==============================================================================
# The heist demo (demo_heist.py) handles all audio entirely in Python:
#   - Speechmatics TTS synthesizes speech via services/speechmatics_service.py
#   - Audio is played locally via pydub
#   - Speechmatics ASR transcribes audio (when ENABLE_SPEECHMATICS_ASR=true)
#   - Transcribed text is posted to the REST channel above
#
# Speechmatics is not a native Rasa browser_audio provider (Rasa supports
# Deepgram, Azure, Cartesia, and Rime natively). Including a browser_audio
# block without valid asr/tts fields causes Rasa to fail at startup.