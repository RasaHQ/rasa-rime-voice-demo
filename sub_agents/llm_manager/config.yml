agent:
  name: llm_manager
  protocol: RASA
  description: >
    A senior customer service manager at First National Bank.
    Handles escalated calls from customers who requested to speak
    to a human manager. More conversational and flexible than the
    automated system — but has no structured guardrails.

configuration:
  module: sub_agents.llm_manager.manager_agent.LLMManagerAgent
  llm:
    model_group: nebius_llm
  timeout: 60

# References the filesystem MCP entry declared in endpoints.yml.
# All tools excluded — manager uses only custom tools from manager_agent.py.
connections:
  mcp_servers:
    - name: filesystem
      exclude_tools:
        - read_file
        - list_directory
        - get_file_info
        - read_multiple_files
        - search_files
        - directory_tree
        - write_file
        - create_directory
        - move_file
        - delete_file
        - append_file