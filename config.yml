# config.yml
recipe: default.v1
language: en

assistant_id: voice_banking_assistant

pipeline:
  - name: CompactLLMCommandGenerator
    llm:
      model_group: nebius_llm
    flow_retrieval:
      embeddings:
        model_group: nebius_embeddings
    user_input:
      max_characters: 2000  # raise from default 420 — prevents "too long" errors

policies:
  - name: FlowPolicy